name: CI

on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches regressions from new uv releases between commits.
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        run: |
          shellcheck -x \
            bin/uvm \
            lib/uvm-config.sh \
            lib/uvm-core.sh \
            lib/uvm-shell-hooks.sh \
            install.sh \
            uninstall.sh \
            completions/uvm.bash

  syntax:
    name: Syntax Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        run: |
          bash -n bin/uvm
          bash -n lib/uvm-config.sh
          bash -n lib/uvm-core.sh
          bash -n lib/uvm-shell-hooks.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n completions/uvm.bash

  bats:
    name: BATS (${{ matrix.os }}, uv ${{ matrix.uv-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        uv-version: ["0.10.0", "0.12.23", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: false
      - name: Install pinned bats-core
        run: |
          git clone --depth 1 --branch v1.12.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          echo "$RUNNER_TEMP/bats-core/bin" >> "$GITHUB_PATH"
      - name: Run test suite
        run: bats tests/uvm.bats

  smoke:
    name: Smoke (${{ matrix.os }}, uv ${{ matrix.uv-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        uv-version: ["0.12.23", "latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: false
      - name: Install uvm
        run: |
          bash install.sh -y
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          "$HOME/.local/bin/uvm" doctor
      - name: Verify shell hook
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$("$HOME/.local/bin/uvm" shell-hook)"
          type uvm
          uvm doctor
          uvm list
      - name: Create, activate, export, rename, and delete environment
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$("$HOME/.local/bin/uvm" shell-hook)"
          uvm create smoke-env --python 3.11
          uvm activate smoke-env
          python --version
          uvm deactivate
          uvm export smoke-env
          uvm rename smoke-env smoke-renamed
          uvm delete smoke-renamed --force
          uvm list --json
      - name: Mirror config is written where uv reads it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          probe_url="https://uvm-mirror-probe.invalid/simple"

          check_mirror() {
            local expected
            if [ "$RUNNER_OS" = "Windows" ]; then
              expected="$(cygpath -u "$APPDATA")/uv/uv.toml"
            else
              expected="${XDG_CONFIG_HOME:-$HOME/.config}/uv/uv.toml"
            fi
            echo "Expecting uv config at: ${expected}"

            uvm config mirror set "$probe_url"
            grep -q "$probe_url" "$expected"
            [[ "$(uvm config mirror show)" == *"$expected"* ]]
            [[ "$(uvm doctor)" == *"UV config file    : ${expected}"* ]]
            # uv itself must pick up the block: resolution has to hit the probe host.
            compile_output="$(echo six | uv pip compile - --no-cache -q 2>&1 || true)"
            [[ "$compile_output" == *"uvm-mirror-probe.invalid"* ]]

            uvm config mirror remove
            ! grep -q '# >>> uvm mirror >>>' "$expected"
          }

          check_mirror
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" check_mirror

  consistency:
    name: Release and documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate 1.2.1 declarations and retired paths
        run: |
          grep -q 'UVM_VERSION="1.2.1"' bin/uvm
          grep -q 'UVM_INSTALL_VERSION="1.2.1"' install.sh
          grep -q '^## \[1.2.1\]' CHANGELOG.md
          grep -q '1.2.1' README.md
          grep -q '1.2.1' README_CN.md
          if grep -R -n '\[python-downloads\]' \
              README.md README_CN.md EXAMPLES.md project_document templates lib; then
            echo "Retired invalid [python-downloads] table is still documented or emitted"
            exit 1
          fi
          if grep -R -n 'python.*-m pip' lib tests; then
            echo "Retired python -m pip path is still present"
            exit 1
          fi
