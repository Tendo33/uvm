name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: .
          ignore_paths: >-
            .git
            .history
            .specify
            .claude

  syntax:
    name: Syntax Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n bin/uvm
          bash -n lib/uvm-config.sh
          bash -n lib/uvm-core.sh
          bash -n lib/uvm-shell-hooks.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n fix-shell-hook.sh
          bash -n tests/uvm.bats

  bats:
    name: BATS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          echo "$RUNNER_TEMP/bats-core/bin" >> "$GITHUB_PATH"
      - name: Run test suite
        run: bats tests/uvm.bats

  windows-smoke:
    name: Windows Git Bash Smoke Test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install uvm
        run: |
          bash install.sh -y
          export PATH="$HOME/.local/bin:$PATH"
          "$HOME/.local/bin/uvm" doctor
      - name: Verify shell hook
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$("$HOME/.local/bin/uvm" shell-hook)"
          type uvm
          uvm doctor
          uvm list
