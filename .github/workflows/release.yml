name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  quality:
    name: Full release quality suite
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and source versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SCRIPT_VERSION=$(sed -n 's/^UVM_VERSION="\([^"]*\)"/\1/p' bin/uvm)
          INSTALL_VERSION=$(sed -n 's/^UVM_INSTALL_VERSION="\([^"]*\)"/\1/p' install.sh)
          test "$TAG_VERSION" = "$SCRIPT_VERSION"
          test "$TAG_VERSION" = "$INSTALL_VERSION"
          grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md

      - name: Build release assets and notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar --exclude='.git' --exclude='.history' --exclude='.specify' \
            --exclude='.github' -czf "/tmp/uvm-${VERSION}.tar.gz" .
          mv "/tmp/uvm-${VERSION}.tar.gz" "uvm-${VERSION}.tar.gz"
          zip -r "/tmp/uvm-${VERSION}.zip" . \
            -x '.git/*' -x '.history/*' -x '.specify/*' -x '.github/*'
          mv "/tmp/uvm-${VERSION}.zip" "uvm-${VERSION}.zip"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_args+=(--prerelease) ;;
            *) prerelease_args+=(--latest) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "uvm-${GITHUB_REF_NAME#v}.tar.gz" \
            "uvm-${GITHUB_REF_NAME#v}.zip" \
            install.sh uninstall.sh \
            --verify-tag \
            --title "uvm $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
